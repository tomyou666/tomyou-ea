# Exclude a variety of commonly ignored directories.
exclude = [
".bzr",
".direnv",
".eggs",
".git",
".git-rewrite",
".hg",
".ipynb_checkpoints",
".mypy_cache",
".nox",
".pants.d",
".pyenv",
".pytest_cache",
".pytype",
".ruff_cache",
".svn",
".tox",
".venv",
".vscode",
"__pypackages__",
"_build",
"buck-out",
"build",
"dist",
"node_modules",
"site-packages",
"venv",
]

# Same as Black.
line-length = 119
indent-width = 4

# Assume Python 3.11
target-version = "py311"

[lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
select = ["ALL"]
ignore = [
"RUF100",
"COM812", "COM819",
"RUF002","RUF003",
"D103", "D100", "D102", "D107", "D203", "D205", "D213", "D300", "D301", "D400", "D401", "D415", "D417",
"E111", "E114", "E117", "E203", "E402",
"FBT002",
"ISC001", "ISC002",
"INP001",
"B504", "RET505",
"S101", "S110", "S603",
"SIM105",
"TCH002",
"Q000", "Q001", "Q002", "Q003",
"G004",
"W191",
"EM101", "EM102",
"ERA001",
"PGH003",
"PD901",
"PLR2004",
"EXE", "ANN", "TRY", "A", "BLE", "T", "FBT"
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
